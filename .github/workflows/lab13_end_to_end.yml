name: Student Performance Lab 13

on:
  push:
    branches: [main, master, experiment9-failure-recovery]

  pull_request:
    branches: [main, master, experiment9-failure-recovery]

  workflow_dispatch:

jobs:
  end-to-end-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate data
        run: python src/validate_data.py

      - name: Run ML pipeline
        run: python pipelines/pipeline.py

      - name: Upload Lab 13 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-performance-lab13-results
          path: |
            outputs/
            reports/
          if-no-files-found: warn